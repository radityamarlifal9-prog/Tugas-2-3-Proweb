<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sederhana</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
        }
        .kotak {
            border: 1px solid #ccc;
            padding: 25px;
            border-radius: 8px;
        }
        label {
            display: inline-block;
            width: 150px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        input {
            padding: 8px;
            width: 200px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .tombol-operasi {
            margin: 15px 0 15px 150px;
        }
        button {
            padding: 10px 18px;
            margin: 0 5px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            background: #4CAF50;
            color: white;
            border-radius: 4px;
        }
        button:hover {
            background: #45a049;
        }
        #output {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="kotak">
        <h2>Kalkulator Aritmatika Sederhana</h2>
        <br>
        
        <label for="bil1">Input Bilangan 1</label>
        <input type="number" id="bil1" placeholder="Masukkan angka pertama">
        <br>

        <label for="bil2">Input Bilangan 2</label>
        <input type="number" id="bil2" placeholder="Masukkan angka kedua">
        <br>

        <div class="tombol-operasi">
            <button onclick="hitung('tambah')">+</button>
            <button onclick="hitung('kurang')">-</button>
            <button onclick="hitung('kali')">×</button>
            <button onclick="hitung('bagi')">/</button>
        </div>

        <label>Output</label>
        <input type="text" id="output" readonly>
    </div>

    <script>
        function hitung(operasi) {
            // Ambil nilai dari input
            let bil1 = parseFloat(document.getElementById('bil1').value);
            let bil2 = parseFloat(document.getElementById('bil2').value);
            let hasil;

            // Cek apakah input sudah diisi
            if (isNaN(bil1) || isNaN(bil2)) {
                alert('Silakan masukkan kedua bilangan!');
                return;
            }

            // Lakukan perhitungan sesuai operasi
            switch(operasi) {
                case 'tambah':
                    hasil = bil1 + bil2;
                    break;
                case 'kurang':
                    hasil = bil1 - bil2;
                    break;
                case 'kali':
                    hasil = bil1 * bil2;
                    break;
                case 'bagi':
                    if (bil2 === 0) {
                        alert('Tidak bisa dibagi nol!');
                        return;
                    }
                    hasil = bil1 / bil2;
                    break;
            }

            // Tampilkan hasil
            document.getElementById('output').value = hasil;
        }
    </script>
</body>
</html>
